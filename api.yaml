openapi: 3.0.3

info:
  title: Placement Portal Application API
  description: >
    REST API documentation for the Placement Portal Application.
    The application supports Admin, Company, and Student roles
    using Flask session-based authentication.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local Flask development server

tags:
  - name: Authentication
    description: Authentication and registration APIs

  - name: Admin
    description: Admin management APIs

  - name: Company
    description: Company and placement drive APIs

  - name: Student
    description: Student profile and placement application APIs

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate Admin, Company, or Student.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid email or password
        "403":
          description: Account blocked or company not approved

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout current user
      responses:
        "200":
          description: Logout successful

  /auth/current-user:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user information
        "401":
          description: Authentication required

  /auth/register/student:
    post:
      tags:
        - Authentication
      summary: Register student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - branch
                - cgpa
                - year
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                branch:
                  type: string
                cgpa:
                  type: number
                  format: float
                year:
                  type: integer
      responses:
        "201":
          description: Student registered successfully
        "400":
          description: Invalid registration data

  /auth/register/company:
    post:
      tags:
        - Authentication
      summary: Register company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - company_name
                - hr_email
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                company_name:
                  type: string
                website:
                  type: string
                hr_email:
                  type: string
                  format: email
      responses:
        "201":
          description: Company registered successfully
        "400":
          description: Invalid registration data

  /auth/branches:
    get:
      tags:
        - Authentication
      summary: Get available branches
      responses:
        "200":
          description: List of academic branches

  /admin/dashboard:
    get:
      tags:
        - Admin
      summary: Get Admin dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
        "401":
          description: Authentication required
        "403":
          description: Access forbidden

  /admin/students:
    get:
      tags:
        - Admin
      summary: Get all students
      responses:
        "200":
          description: List of registered students
        "403":
          description: Access forbidden

  /admin/companies:
    get:
      tags:
        - Admin
      summary: Get all companies
      responses:
        "200":
          description: List of registered companies
        "403":
          description: Access forbidden

  /admin/drives:
    get:
      tags:
        - Admin
      summary: Get all placement drives
      responses:
        "200":
          description: List of placement drives
        "403":
          description: Access forbidden

  /admin/applications:
    get:
      tags:
        - Admin
      summary: Get all student applications
      responses:
        "200":
          description: List of placement applications
        "403":
          description: Access forbidden

  /admin/approve-company/{id}:
    post:
      tags:
        - Admin
      summary: Approve company registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company approved successfully
        "403":
          description: Access forbidden
        "404":
          description: Company not found

  /admin/reject-company/{id}:
    post:
      tags:
        - Admin
      summary: Reject company registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company rejected successfully
        "403":
          description: Access forbidden
        "404":
          description: Company not found

  /admin/approve-drive/{id}:
    post:
      tags:
        - Admin
      summary: Approve placement drive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Placement drive approved
        "403":
          description: Access forbidden
        "404":
          description: Drive not found

  /admin/reject-drive/{id}:
    post:
      tags:
        - Admin
      summary: Reject placement drive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Placement drive rejected
        "403":
          description: Access forbidden
        "404":
          description: Drive not found

  /admin/blacklist-student/{id}:
    post:
      tags:
        - Admin
      summary: Deactivate or reactivate student account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student account status updated
        "403":
          description: Access forbidden
        "404":
          description: Student not found

  /admin/blacklist-company/{id}:
    post:
      tags:
        - Admin
      summary: Deactivate or reactivate company account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company account status updated
        "403":
          description: Access forbidden
        "404":
          description: Company not found

  /admin/search/students:
    get:
      tags:
        - Admin
      summary: Search students
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Student search results

  /admin/search/companies:
    get:
      tags:
        - Admin
      summary: Search companies
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Company search results

  /admin/search/drives:
    get:
      tags:
        - Admin
      summary: Search placement drives
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Placement drive search results

  /admin/statistics:
    get:
      tags:
        - Admin
      summary: Get placement statistics
      responses:
        "200":
          description: Placement statistics

  /admin/details/{type}/{id}:
    get:
      tags:
        - Admin
      summary: Get resource details
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - company
              - student
              - drive
              - application
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource details
        "404":
          description: Resource not found

  /company/dashboard:
    get:
      tags:
        - Company
      summary: Get Company dashboard
      responses:
        "200":
          description: Company dashboard information
        "403":
          description: Company access required

  /company/drive/create:
    post:
      tags:
        - Company
      summary: Create placement drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveInput"
      responses:
        "201":
          description: Placement drive created successfully
        "400":
          description: Invalid placement drive data
        "403":
          description: Company access required

  /company/drives:
    get:
      tags:
        - Company
      summary: Get company placement drives
      responses:
        "200":
          description: List of company placement drives
        "403":
          description: Company access required

  /company/applications/{drive_id}:
    get:
      tags:
        - Company
      summary: Get applicants for placement drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of placement drive applicants
        "403":
          description: Unauthorized access
        "404":
          description: Drive not found

  /company/application/update/{id}:
    post:
      tags:
        - Company
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - Pending
                    - Applied
                    - Shortlisted
                    - Rejected
                    - Selected
                    - Interview Scheduled
      responses:
        "200":
          description: Application status updated
        "400":
          description: Invalid application status
        "403":
          description: Unauthorized access
        "404":
          description: Application not found

  /company/application/schedule/{id}:
    post:
      tags:
        - Company
      summary: Schedule student interview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interview_date
              properties:
                interview_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Interview scheduled successfully
        "400":
          description: Interview date is required
        "403":
          description: Unauthorized access
        "404":
          description: Application not found

  /company/get-profile:
    get:
      tags:
        - Company
      summary: Get company profile
      responses:
        "200":
          description: Company profile information
        "403":
          description: Company access required

  /company/update-profile:
    post:
      tags:
        - Company
      summary: Update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                website:
                  type: string
                hr_email:
                  type: string
                  format: email
      responses:
        "200":
          description: Company profile updated
        "403":
          description: Company access required

  /company/drive/{id}:
    put:
      tags:
        - Company
      summary: Update placement drive
      description: >
        Updates a company placement drive. After editing,
        the drive status is changed to Pending for Admin approval.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveInput"
      responses:
        "200":
          description: Drive updated and sent for Admin approval
        "400":
          description: Invalid placement drive data
        "403":
          description: Unauthorized access
        "404":
          description: Drive not found

  /student/get-profile:
    get:
      tags:
        - Student
      summary: Get student profile
      responses:
        "200":
          description: Student profile information
        "403":
          description: Student access required
        "404":
          description: Student profile not found

  /student/update-profile:
    post:
      tags:
        - Student
      summary: Update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                branch:
                  type: string
                cgpa:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 10
                year:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Student profile updated
        "400":
          description: Invalid profile data
        "403":
          description: Student access required

  /student/upload-resume:
    post:
      tags:
        - Student
      summary: Upload student resume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resume
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resume uploaded successfully
        "400":
          description: Invalid resume file
        "403":
          description: Student access required

  /student/drives:
    get:
      tags:
        - Student
      summary: Get eligible placement drives
      description: >
        Returns approved placement drives based on the student's
        branch, CGPA, academic year, and application deadline.
      responses:
        "200":
          description: List of eligible placement drives
        "403":
          description: Student access required

  /student/drive/{drive_id}:
    get:
      tags:
        - Student
      summary: Get placement drive details
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Placement drive details
        "403":
          description: Student not eligible or drive unavailable
        "404":
          description: Drive not found

  /student/search:
    get:
      tags:
        - Student
      summary: Search eligible placement drives
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Placement drive search results
        "403":
          description: Student access required

  /student/apply/{drive_id}:
    post:
      tags:
        - Student
      summary: Apply for placement drive
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Application submitted successfully
        "400":
          description: Student does not meet eligibility criteria
        "403":
          description: Student access required
        "404":
          description: Drive or student not found
        "409":
          description: Student already applied to the placement drive

  /student/history:
    get:
      tags:
        - Student
      summary: Get placement application history
      responses:
        "200":
          description: Student application history
        "403":
          description: Student access required

  /student/export:
    get:
      tags:
        - Student
      summary: Export application history as CSV
      description: >
        Triggers an asynchronous Celery task to generate the student's
        placement application history as a CSV file and send an email alert.
      responses:
        "200":
          description: CSV export job triggered successfully
        "403":
          description: Student access required

components:
  schemas:

    DriveInput:
      type: object
      required:
        - title
        - description
        - branch
        - cgpa
        - year
        - deadline
      properties:
        title:
          type: string
          example: Software Developer Intern
        description:
          type: string
          example: Software development internship placement drive
        branch:
          type: string
          example: BSC
        cgpa:
          type: number
          format: float
          minimum: 0
          maximum: 10
          example: 7.5
        year:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        deadline:
          type: string
          format: date
          example: "2026-07-20"